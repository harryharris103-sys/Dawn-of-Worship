<script>
const DOW_VERSION='1.0.0';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
{const b=document.getElementById('verbadge');if(b)b.textContent='v'+DOW_VERSION}
const OUT=location.hash=='#out';if(OUT)document.body.className='out';
// ---------- storage (IndexedDB: bibles, songs, media) ----------
const db=new Promise(r=>{const q=indexedDB.open('dow',2);q.onupgradeneeded=()=>{const d=q.result;['bible','song','media','font','pptx'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'name'})})};q.onsuccess=()=>r(q.result)});
const tx=async(s,m,f)=>{const d=await db;return new Promise(r=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>r(o.result)})};
const put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),all=s=>tx(s,'readonly',o=>o.getAll()),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
// ---------- screen renderer (used by preview, live and output window) ----------
class Scr{constructor(h){this.h=h;h.innerHTML='<div class=st><div class=bg></div><div class=dm></div><div class=tx></div></div>';this.st=h.firstChild;[this.bg,this.dm,this.tx]=this.st.children;
 new ResizeObserver(()=>{const w=h.clientWidth,H=h.clientHeight,k=Math.min(w/1920,H/1080);this.st.style.transform=`translate(${(w-1920*k)/2}px,${(H-1080*k)/2}px) scale(${k})`}).observe(h)}
 cfg(s){this.s=s;const[t,r,b,l]=s.m;Object.assign(this.tx.style,{inset:`${t}% ${r}% ${b}% ${l}%`,fontFamily:s.ff,textAlign:s.al,color:s.col||'#fff'});this.tx.classList.toggle('sh',s.sh);this.dm.style.opacity=s.dim/100;this.tx.querySelectorAll('.sl').forEach(n=>this.fit(n))}
 fit(n){let f=this.s.fs;n.style.fontSize=f+'px';const w=n.firstChild;while(w.offsetHeight>n.clientHeight&&f>24)n.style.fontSize=(f-=4)+'px'}
 show(sl,tr='fade'){const old=[...this.tx.children];let n;if(sl){n=document.createElement('div');n.className='sl';n.innerHTML=`<div class=w><p>${esc(sl.text)}</p>${sl.ref&&this.s.ref?`<small style="color:${this.s.rcol||'#C9932E'}">${esc(sl.ref)}</small>`:''}</div>`;this.tx.append(n);this.fit(n)}
  const A={fade:[{opacity:0},{opacity:1}],slide:[{transform:'translateX(8%)',opacity:0},{transform:'none',opacity:1}],zoom:[{transform:'scale(.9)',opacity:0},{transform:'none',opacity:1}]};
  if(tr=='cut'||!A[tr])return old.forEach(o=>o.remove());n&&n.animate(A[tr],{duration:500,easing:'ease-out'});old.forEach(o=>o.animate([{opacity:1},{opacity:0}],{duration:500}).onfinish=()=>o.remove())}
 setBg(b){if((b?.u||'')==(this.cu||''))return;this.cu=b?.u;const old=[...this.bg.children];if(b){const e=document.createElement(b.k=='v'?'video':'div');if(b.k=='v')Object.assign(e,{src:b.u,loop:true,muted:true,autoplay:true,playsInline:true});else e.style.backgroundImage=`url("${b.u}")`;this.bg.append(e);e.animate([{opacity:0},{opacity:1}],{duration:600})}
  old.forEach(o=>o.animate([{opacity:1},{opacity:0}],{duration:600}).onfinish=()=>o.remove())}}
// ---------- settings ----------
const D={m:[6,6,6,6],fs:72,dim:30,ff:'Helvetica,Arial,sans-serif',al:'center',sh:true,ref:true,tr:'fade',col:'#ffffff',rcol:'#C9932E'};
let S={...D,...JSON.parse(localStorage.getItem('dow.s')||'{}')};
// ---------- OUTPUT WINDOW ----------
if(OUT){const o=new Scr(document.body.appendChild(Object.assign(document.createElement('div'),{className:'scr'})));o.cfg(S);
 const injectFontsOut=css=>{let st=document.getElementById('cfonts');if(!st){st=document.createElement('style');st.id='cfonts';document.head.appendChild(st)}st.textContent=css||''};
 addEventListener('message',e=>{const d=e.data||{};if(d.s){S=d.s;o.cfg(S)}if('bg'in d)o.setBg(d.bg);if('sl'in d)o.show(d.sl,d.tr);if('fontsCSS'in d)injectFontsOut(d.fontsCSS)});
 const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();addEventListener('dblclick',fs);addEventListener('keydown',e=>e.key=='f'&&fs());opener?.postMessage({ready:1},'*')}
else{
// ---------- OPERATOR ----------
const P=new Scr($('#pv')),L=new Scr($('#lv'));let win=null,bibles={},songs={},media={},pptxs={},customFonts={},slides=[],idx=-1,cur=null,tab='Bible',ver='',dock=JSON.parse(localStorage.getItem('dow.d')||'[]'),templates=JSON.parse(localStorage.getItem('dow.tpl')||'{}');
const b64=buf=>{let bin='';const by=new Uint8Array(buf),CH=0x8000;for(let i=0;i<by.length;i+=CH)bin+=String.fromCharCode(...by.subarray(i,i+CH));return btoa(bin)};
const fontsCSS=()=>Object.entries(customFonts).map(([n,u])=>`@font-face{font-family:"${n.replace(/"/g,'')}";src:url(${u})}`).join('');
const injectFonts=()=>{let st=document.getElementById('cfonts');if(!st){st=document.createElement('style');st.id='cfonts';document.head.appendChild(st)}st.textContent=fontsCSS()};
const BUILTIN_FONTS=[['Helvetica,Arial,sans-serif','Helvetica/Arial'],['Georgia,serif','Georgia'],["'Trebuchet MS',sans-serif",'Trebuchet']];
function renderFontSelect(){const sel=$('#ffsel');if(!sel)return;const cur=sel.value||S.ff;sel.innerHTML=BUILTIN_FONTS.map(([v,l])=>`<option value="${v}">${l}</option>`).join('')+(Object.keys(customFonts).length?`<optgroup label="Imported">${Object.keys(customFonts).map(n=>`<option value="'${n.replace(/'/g,"")}',sans-serif">${esc(n)}</option>`).join('')}</optgroup>`:'');sel.value=cur}
function renderTemplates(){$('#tpl').innerHTML=Object.keys(templates).sort().map(n=>`<div class=it data-tp="${esc(n)}"><span>🎛 ${esc(n)}</span><x data-dtp="${esc(n)}">✕</x></div>`).join('')||'<span style="color:#777;font-size:11px">No templates saved yet.</span>'}
function applyTemplate(n){const t=templates[n];if(!t)return;S={...D,...t};syncInputs();applyS()}

const pv={sl:null,bg:null},lv={sl:null,bg:null};
const send=m=>{try{win&&!win.closed&&win.postMessage(m,'*')}catch(e){}};
addEventListener('message',e=>{if(e.data?.ready)send({s:S,sl:lv.sl,bg:lv.bg,tr:'cut',fontsCSS:fontsCSS()})});
const url=m=>m.u||(m.u=URL.createObjectURL(m.blob));
const applyS=()=>{localStorage.setItem('dow.s',JSON.stringify(S));P.cfg(S);L.cfg(S);send({s:S,fontsCSS:fontsCSS()})};
function take(){if(!pv.sl&&!pv.bg)return;lv.sl=pv.sl;lv.bg=pv.bg;L.setBg(lv.bg);L.show(lv.sl,S.tr);send({bg:lv.bg,sl:lv.sl,tr:S.tr});draw()}
function pick(i){if(i<0||i>=slides.length)return;idx=i;pv.sl=slides[i];P.show(pv.sl,'cut');$('#au').checked?take():draw()}
function blank(){lv.sl=null;L.show(null,S.tr);send({sl:null,tr:S.tr});draw()}
function load(sl,c){slides=sl;cur=c;pick(0)}
function draw(){$('#sls').innerHTML=slides.map((s,i)=>`<div class="sc ${i==idx?'on':''} ${lv.sl===s?'lv':''}" data-i="${i}">${esc(s.text)}</div>`).join('')||'<span style="color:#777">Load a verse or song…</span>';
 $('#dk').innerHTML=dock.map((d,i)=>`<div class=it data-d="${i}"><span>${d.t=='b'?'📖':d.t=='s'?'♪':'🖵'} ${esc(d.label)}</span><x data-x="${i}">✕</x></div>`).join('')||'<span style="color:#777">Empty — load something and press ＋ Dock</span>'}
// Bible
const nz=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function bible(q,v=ver){const B=bibles[v];if(!B)return alert('Import a Bible first.');const m=q.trim().match(/^(.+?)\s*(\d+)(?:\s*:\s*(\d+)(?:\s*-\s*(\d+))?)?$/);if(!m)return alert('Try e.g. John 3:16-18');
 const ks=Object.keys(B),n=nz(m[1]),bk=ks.find(k=>nz(k)==n)||ks.find(k=>nz(k).startsWith(n));if(!bk)return alert('Book not found');const ch=B[bk][m[2]];if(!ch)return alert('Chapter not found');
 const vs=Object.keys(ch).map(Number).sort((a,b)=>a-b),a=m[3]?+m[3]:null,z=m[4]?+m[4]:a,fx=t=>t.replace(/([,:])"(?=[A-Za-z])/g,'$1 "'),R=(x,y)=>`${bk} ${m[2]}:${x}${y!=x?'-'+y:''} (${v})`;let out=[];
 if(a===null)out=vs.map(x=>({text:fx(ch[x]),ref:R(x,x)}));else{let buf=[],len=0;const fl=()=>{if(buf.length)out.push({text:buf.map(x=>fx(ch[x])).join(' '),ref:R(buf[0],buf.at(-1))});buf=[];len=0};
  vs.filter(x=>x>=a&&x<=z).forEach(x=>{if(len+ch[x].length>280)fl();buf.push(x);len+=ch[x].length});fl()}
 if(!out.length)return alert('Verse not found');load(out,{t:'b',v,ref:q,label:`${bk} ${m[2]}${a?':'+a+(z!=a?'-'+z:''):''} (${v})`})}
// Songs
function song(n){const s=songs[n];if(s)load(s.text.replace(/\r/g,'').trim().split(/\n\s*\n/).map(t=>({text:t.trim(),ref:''})),{t:'s',name:n,label:n})}
// Library panels
function panel(){const p=$('#pn');$('.tabs').innerHTML=['Bible','Songs','Media','PPTX'].map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('');
 if(tab=='Bible'){const vk=Object.keys(bibles);
  if(!vk.length){p.innerHTML=`<div class=row><button onclick="$('#bf').click()">Import Bible .json</button><input id=bf type=file accept=".json" hidden></div><small style="color:#888">No Bible version loaded yet — import one to begin.</small>`;
   $('#bf').onchange=async e=>{for(const f of e.target.files){const d=JSON.parse(await f.text());await put('bible',{name:f.name.replace(/\.json$/i,'').toUpperCase(),data:d})}await boot()};return}
  p.innerHTML=`<div class=row><select id=bv style="flex:1">${vk.map(v=>`<option ${v==ver?'selected':''}>${esc(v)}</option>`).join('')}</select><button onclick="$('#bf').click()">Import .json</button><input id=bf type=file accept=".json" hidden></div>
  <div class=row><select id=bb style="flex:2"></select><select id=bc style="width:66px"></select></div>
  <div class=row><input id=bva type=number min=1 placeholder="verse a" style="width:0;flex:1"><span style="align-self:center;color:#999">to</span><input id=bvb type=number min=1 placeholder="verse b" style="width:0;flex:1"></div>
  <div class=row><button class=go id=gb style="flex:1">Go</button></div>
  <small style="color:#888">Leave "verse a" blank for the whole chapter. Fill only "a" for a single verse. Ranges auto-split into slides.</small>`;
  const OT=new Set(['genesis','exodus','leviticus','numbers','deuteronomy','joshua','judges','ruth','1samuel','2samuel','1kings','2kings','1chronicles','2chronicles','ezra','nehemiah','esther','job','psalms','psalm','proverbs','ecclesiastes','songofsolomon','songofsongs','isaiah','jeremiah','lamentations','ezekiel','daniel','hosea','joel','amos','obadiah','jonah','micah','nahum','habakkuk','zephaniah','haggai','zechariah','malachi']);
  const fillBooks=()=>{const B=bibles[ver]||{},ks=Object.keys(B),ot=ks.filter(k=>OT.has(nz(k))),nt=ks.filter(k=>!OT.has(nz(k))),opt=a=>a.map(k=>`<option>${esc(k)}</option>`).join('');
   $('#bb').innerHTML=(ot.length?`<optgroup label="Old Testament">${opt(ot)}</optgroup>`:'')+(nt.length?`<optgroup label="New Testament">${opt(nt)}</optgroup>`:'')||opt(ks);fillChapters()};
  const fillChapters=()=>{const B=bibles[ver]||{},bk=$('#bb').value,ch=B[bk]?Object.keys(B[bk]).map(Number).sort((a,b)=>a-b):[];$('#bc').innerHTML=ch.map(c=>`<option>${c}</option>`).join('')};
  fillBooks();$('#bf').onchange=async e=>{for(const f of e.target.files){const d=JSON.parse(await f.text());await put('bible',{name:f.name.replace(/\.json$/i,'').toUpperCase(),data:d})}await boot()};
  $('#bv').onchange=e=>{ver=e.target.value;fillBooks()};$('#bb').onchange=fillChapters;
  const go=()=>{const bk=$('#bb').value,c=$('#bc').value,a=$('#bva').value.trim(),z=$('#bvb').value.trim();if(!bk||!c)return;bible(`${bk} ${c}${a?':'+a+(z&&z!=a?'-'+z:''):''}`)};
  $('#gb').onclick=go;[$('#bva'),$('#bvb')].forEach(i=>{i.onkeydown=e=>{if(e.key=='Enter')go()}})}
 else if(tab=='Songs'){p.innerHTML=`<div class=row><input id=sq placeholder="Search songs"><button onclick="$('#sf').click()">Import .txt</button><input id=sf type=file accept=".txt" multiple hidden></div><div id=sl></div><small style="color:#888">Separate slides with a blank line.</small>`;
  const ls=()=>{$('#sl').innerHTML=Object.keys(songs).filter(n=>n.toLowerCase().includes($('#sq').value.toLowerCase())).sort().map(n=>`<div class=it data-s="${esc(n)}"><span>♪ ${esc(n)}</span><x data-ds="${esc(n)}">✕</x></div>`).join('')};ls();$('#sq').oninput=ls;

 else if(tab=='Media'){p.innerHTML=`<div class=row><select id=ma><option>Both</option><option>Preview</option><option>Live</option></select><button onclick="$('#mf').click()">Import</button><input id=mf type=file accept=".jpg,.jpeg,.png,.mp4,.webm,.wmv" multiple hidden></div><div class=mg><div class=mt data-m="" style="display:grid;place-items:center">None</div>${Object.values(media).map(m=>`<div class=mt data-m="${esc(m.name)}">${m.k=='v'?`<video src="${url(m)}" muted preload=metadata></video>`:`<img src="${url(m)}">`}<x data-dm="${esc(m.name)}">✕</x></div>`).join('')}</div><small style="color:#888">Note: browsers can't play .wmv reliably — convert to .mp4.</small>`;

 else{p.innerHTML=`<div class=row><button onclick="$('#pf').click()">Import .pptx</button><input id=pf type=file accept=".pptx" multiple hidden></div><div id=pl></div><small style="color:#888">Extracts each slide's text as a slide (layout, images and fonts inside the .pptx aren't carried over — use Display Settings for styling).</small>`;
  $('#pl').innerHTML=Object.keys(pptxs).sort().map(n=>`<div class=it data-p="${esc(n)}"><span>🖵 ${esc(n)}</span><x data-dp="${esc(n)}">✕</x></div>`).join('')||'<span style="color:#777">No presentations imported yet.</span>';
  $('#pf').onchange=async e=>{if(typeof JSZip=='undefined'){alert('PPTX support needs an internet connection the first time (to load the unzip library). Try again while online.');e.target.value='';return}for(const f of e.target.files){try{const zip=await JSZip.loadAsync(f);const fs2=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/slide(\d+)\.xml/)[1])-(+b.match(/slide(\d+)\.xml/)[1]));const sl2=[];for(const fn of fs2){const xml=await zip.file(fn).async('text');const doc=new DOMParser().parseFromString(xml,'application/xml');const paras=[...doc.getElementsByTagName('a:p')].map(pn=>[...pn.getElementsByTagName('a:t')].map(tn=>tn.textContent).join('')).filter(t2=>t2.trim());if(paras.length)sl2.push({text:paras.join('\n'),ref:''})}if(sl2.length)await put('pptx',{name:f.name.replace(/\.pptx$/i,''),slides:sl2});else alert(f.name+': no readable text found in this presentation.')}catch(err){alert('Could not read '+f.name+' — is it a valid .pptx file?')}}await boot()}}}
async function boot(){bibles={};(await all('bible')).forEach(b=>bibles[b.name]=b.data);

 songs={};(await all('song')).forEach(s=>songs[s.name]=s);media={};(await all('media')).forEach(m=>media[m.name]=m);pptxs={};(await all('pptx')).forEach(p=>pptxs[p.name]=p);
 customFonts={};(await all('font')).forEach(f=>customFonts[f.name]=f.data);injectFonts();renderFontSelect();
 if(!bibles[ver])ver=Object.keys(bibles)[0]||'';panel();draw()}

 else if(t.dataset.dm){del('media',t.dataset.dm).then(boot)}else if(g('data-m')!==null&&g('data-m')!==undefined){const m=media[g('data-m')],b=m?{u:url(m),k:m.k}:null,w=$('#ma').value;if(w!='Live'){pv.bg=b;P.setBg(b)}if(w!='Preview'){lv.bg=b;L.setBg(b);send({bg:b})}}
 else if(t.dataset.dp){del('pptx',t.dataset.dp).then(boot)}else if(g('data-p')!==null&&g('data-p')!==undefined)pptxLoad(g('data-p'));
 else if(t.dataset.dtp){delete templates[t.dataset.dtp];localStorage.setItem('dow.tpl',JSON.stringify(templates));renderTemplates()}else if(g('data-tp')!==null&&g('data-tp')!==undefined)applyTemplate(g('data-tp'));
 else if(g('data-i')!==null&&g('data-i')!==undefined)pick(+g('data-i'));else if(t.dataset.x){dock.splice(+t.dataset.x,1);sv()}else if(g('data-d')!==null&&g('data-d')!==undefined){const d=dock[+g('data-d')];d.t=='b'?bible(d.ref,d.v):d.t=='s'?song(d.name):pptxLoad(d.name)}});

addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='ArrowRight')pick(idx+1);if(e.key=='ArrowLeft')pick(idx-1);if(e.key=='Enter')take();if(e.key=='b'||e.key=='B')blank()});
