  DOW Software — Dawn of Worship | Mega Tag Enterprise
  CHANGELOG
  v1.0.0 — Initial full release: Bible import (auto-loads niv.json) with Book/Chapter/Verse
           selector (OT/NT grouped), song .txt import, media backgrounds (jpg/mp4/webm),
           preview/live screens with transitions, quick-access dock, display settings
           (margins, font, size, alignment incl. justify, colours, shadow), fixed 16:9
           letterboxed output window, template save/load, custom font import, dark/light
           control-panel theme, PPTX import (slide text only, needs internet first time).
  v1.1.0 — Bible importer now recognises the common "metadata + flat verses[]" JSON schema
           (e.g. scrollmapper/bible_databases KJV, ASV exports) in addition to the nested
           Book/Chapter/Verse schema, and picks up the version's real name/shortname from
           its metadata automatically. PPTX import now recreates each slide's actual layout
           (positioned text boxes with their own size/colour/bold, plus embedded images and
           slide background) instead of just extracted text. Added GitHub-folder auto-sync
           (🔄 button, header) that lists the repo folder via the GitHub API and imports any
           new .json Bibles, images/video, .pptx decks and .txt lyric files it finds —
           runs automatically once per load and skips anything already imported.
  v1.1.1 — Fixed: Text colour picker had no effect (a hardcoded white was baked into the
           slide CSS, overriding it). Text and ref colour changes now also apply instantly
           to whatever slide is currently showing, instead of only the next slide loaded.
  v1.2.0 — Output window now: (1) carries a stable, distinctive title ("DOW Software —
           OUTPUT") so it's easy to target by name in OBS's Window Capture source; (2)
           attempts to go fullscreen automatically the moment it opens, removing the
           browser title bar — falls back to an on-screen "press F or double-click" hint
           if the browser blocks the automatic attempt (a real user click still always
           works). Note: a browser window can't make itself into an OS-level second
           display — if you have an actual second monitor/projector connected, "Open
           Output" already auto-detects it and fills it completely, which is what lets
           OBS's Display Capture pick it up as that monitor; without a real second screen,
           Window Capture targeting the output window's title is the way to go.
  Bump DOW_VERSION below and add a new line here whenever a change ships.

async function parsePptx(file){const zip=await JSZip.loadAsync(file);let cx=12192000,cy=6858000;
 try{const pres=await zip.file('ppt/presentation.xml').async('text');const pd=new DOMParser().parseFromString(pres,'application/xml');const sz=pd.getElementsByTagName('p:sldSz')[0];if(sz){cx=+sz.getAttribute('cx')||cx;cy=+sz.getAttribute('cy')||cy}}catch(e){}

 const imgCache={};
 async function resolveEmbed(rels,rId,baseDir){if(!rels||!rId)return null;const rel=[...rels.getElementsByTagName('Relationship')].find(r=>r.getAttribute('Id')===rId);if(!rel)return null;const path=pptxPath(baseDir,rel.getAttribute('Target'));if(imgCache[path])return imgCache[path];const zf=zip.file(path);if(!zf)return null;const ext=path.split('.').pop();const data=await zf.async('base64');const durl=`data:${mimeFor(ext)};base64,${data}`;imgCache[path]=durl;return durl}
 const slideFiles=Object.keys(zip.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>(+a.match(/slide(\d+)\.xml/)[1])-(+b.match(/slide(\d+)\.xml/)[1]));

  const doc=new DOMParser().parseFromString(await zip.file(fn).async('text'),'application/xml');

  const bg=doc.getElementsByTagName('p:bg')[0];
  if(bg){const srgb=bg.getElementsByTagName('a:srgbClr')[0];if(srgb)bgColor='#'+srgb.getAttribute('val');const blip=bg.getElementsByTagName('a:blip')[0];if(blip)bgImage=await resolveEmbed(rels,blip.getAttribute('r:embed'),'ppt/slides')}

     if(runs.length&&size===null){const rPr=runs[0].getElementsByTagName('a:rPr')[0];if(rPr){const sz=rPr.getAttribute('sz');if(sz)size=Math.max(10,+sz/100*pxPerPt);if(rPr.getAttribute('b')==='1')bold=true;const sc=rPr.getElementsByTagName('a:srgbClr')[0];if(sc)color='#'+sc.getAttribute('val')}}

function take(){if(!pv.sl&&!pv.bg)return;lv.sl=pv.sl;lv.bg=pv.bg;L.setBg(lv.bg);L.show(lv.sl,S.tr);send({bg:lv.bg,sl:lv.sl,tr:S.tr});draw()}
function pick(i){if(i<0||i>=slides.length)return;idx=i;pv.sl=slides[i];P.show(pv.sl,'cut');$('#au').checked?take():draw()}
function blank(){lv.sl=null;L.show(null,S.tr);send({sl:null,tr:S.tr});draw()}
function load(sl,c){slides=sl;cur=c;pick(0)}
function draw(){$('#sls').innerHTML=slides.map((s,i)=>`<div class="sc ${i==idx?'on':''} ${lv.sl===s?'lv':''}" data-i="${i}">${esc(s.text)}</div>`).join('')||'<span style="color:#777">Load a verse or song…</span>';
 $('#dk').innerHTML=dock.map((d,i)=>`<div class=it data-d="${i}"><span>${d.t=='b'?'📖':d.t=='s'?'♪':'🖵'} ${esc(d.label)}</span><x data-x="${i}">✕</x></div>`).join('')||'<span style="color:#777">Empty — load something and press ＋ Dock</span>'}
// Bible
const nz=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');
function normalizeBible(raw){
 if(raw&&Array.isArray(raw.verses)){const data={};for(const v of raw.verses){const bk=v.book_name||v.book;if(bk==null)continue;const ch=String(v.chapter),vs=String(v.verse);(data[bk]||(data[bk]={}));(data[bk][ch]||(data[bk][ch]={}));data[bk][ch][vs]=v.text}
  const name=raw.metadata&&(raw.metadata.shortname||raw.metadata.name)||null;return{data,name}}
 return{data:raw,name:null}}
function bible(q,v=ver){const B=bibles[v];if(!B)return alert('Import a Bible first.');const m=q.trim().match(/^(.+?)\s*(\d+)(?:\s*:\s*(\d+)(?:\s*-\s*(\d+))?)?$/);if(!m)return alert('Try e.g. John 3:16-18');
 const ks=Object.keys(B),n=nz(m[1]),bk=ks.find(k=>nz(k)==n)||ks.find(k=>nz(k).startsWith(n));if(!bk)return alert('Book not found');const ch=B[bk][m[2]];if(!ch)return alert('Chapter not found');
 const vs=Object.keys(ch).map(Number).sort((a,b)=>a-b),a=m[3]?+m[3]:null,z=m[4]?+m[4]:a,fx=t=>t.replace(/([,:])"(?=[A-Za-z])/g,'$1 "'),R=(x,y)=>`${bk} ${m[2]}:${x}${y!=x?'-'+y:''} (${v})`;let out=[];
 if(a===null)out=vs.map(x=>({text:fx(ch[x]),ref:R(x,x)}));else{let buf=[],len=0;const fl=()=>{if(buf.length)out.push({text:buf.map(x=>fx(ch[x])).join(' '),ref:R(buf[0],buf.at(-1))});buf=[];len=0};
  vs.filter(x=>x>=a&&x<=z).forEach(x=>{if(len+ch[x].length>280)fl();buf.push(x);len+=ch[x].length});fl()}
 if(!out.length)return alert('Verse not found');load(out,{t:'b',v,ref:q,label:`${bk} ${m[2]}${a?':'+a+(z!=a?'-'+z:''):''} (${v})`})}
// Songs
function song(n){const s=songs[n];if(s)load(s.text.replace(/\r/g,'').trim().split(/\n\s*\n/).map(t=>({text:t.trim(),ref:''})),{t:'s',name:n,label:n})}
// Library panels
function panel(){const p=$('#pn');$('.tabs').innerHTML=['Bible','Songs','Media','PPTX'].map(t=>`<button class="${t==tab?'on':''}" data-t="${t}">${t}</button>`).join('');
 if(tab=='Bible'){const vk=Object.keys(bibles);
  if(!vk.length){p.innerHTML=`<div class=row><button onclick="$('#bf').click()">Import Bible .json</button><input id=bf type=file accept=".json" hidden></div><small style="color:#888">No Bible version loaded yet — import one to begin.</small>`;
   $('#bf').onchange=async e=>{for(const f of e.target.files){const raw=JSON.parse(await f.text());const{data,name}=normalizeBible(raw);await put('bible',{name:(name||f.name.replace(/\.json$/i,'')).toUpperCase(),data})}await boot()};return}
  p.innerHTML=`<div class=row><select id=bv style="flex:1">${vk.map(v=>`<option ${v==ver?'selected':''}>${esc(v)}</option>`).join('')}</select><button onclick="$('#bf').click()">Import .json</button><input id=bf type=file accept=".json" hidden></div>
  <div class=row><select id=bb style="flex:2"></select><select id=bc style="width:66px"></select></div>
  <div class=row><input id=bva type=number min=1 placeholder="verse a" style="width:0;flex:1"><span style="align-self:center;color:#999">to</span><input id=bvb type=number min=1 placeholder="verse b" style="width:0;flex:1"></div>
  <div class=row><button class=go id=gb style="flex:1">Go</button></div>
  <small style="color:#888">Leave "verse a" blank for the whole chapter. Fill only "a" for a single verse. Ranges auto-split into slides.</small>`;
  const OT=new Set(['genesis','exodus','leviticus','numbers','deuteronomy','joshua','judges','ruth','1samuel','2samuel','1kings','2kings','1chronicles','2chronicles','ezra','nehemiah','esther','job','psalms','psalm','proverbs','ecclesiastes','songofsolomon','songofsongs','isaiah','jeremiah','lamentations','ezekiel','daniel','hosea','joel','amos','obadiah','jonah','micah','nahum','habakkuk','zephaniah','haggai','zechariah','malachi']);
  const fillBooks=()=>{const B=bibles[ver]||{},ks=Object.keys(B),ot=ks.filter(k=>OT.has(nz(k))),nt=ks.filter(k=>!OT.has(nz(k))),opt=a=>a.map(k=>`<option>${esc(k)}</option>`).join('');
   $('#bb').innerHTML=(ot.length?`<optgroup label="Old Testament">${opt(ot)}</optgroup>`:'')+(nt.length?`<optgroup label="New Testament">${opt(nt)}</optgroup>`:'')||opt(ks);fillChapters()};
  const fillChapters=()=>{const B=bibles[ver]||{},bk=$('#bb').value,ch=B[bk]?Object.keys(B[bk]).map(Number).sort((a,b)=>a-b):[];$('#bc').innerHTML=ch.map(c=>`<option>${c}</option>`).join('')};
  fillBooks();$('#bf').onchange=async e=>{for(const f of e.target.files){const raw=JSON.parse(await f.text());const{data,name}=normalizeBible(raw);await put('bible',{name:(name||f.name.replace(/\.json$/i,'')).toUpperCase(),data})}await boot()};
  $('#bv').onchange=e=>{ver=e.target.value;fillBooks()};$('#bb').onchange=fillChapters;
  const go=()=>{const bk=$('#bb').value,c=$('#bc').value,a=$('#bva').value.trim(),z=$('#bvb').value.trim();if(!bk||!c)return;bible(`${bk} ${c}${a?':'+a+(z&&z!=a?'-'+z:''):''}`)};
  $('#gb').onclick=go;[$('#bva'),$('#bvb')].forEach(i=>{i.onkeydown=e=>{if(e.key=='Enter')go()}})}
 else if(tab=='Songs'){p.innerHTML=`<div class=row><input id=sq placeholder="Search songs"><button onclick="$('#sf').click()">Import .txt</button><input id=sf type=file accept=".txt" multiple hidden></div><div id=sl></div><small style="color:#888">Separate slides with a blank line.</small>`;
  const ls=()=>{$('#sl').innerHTML=Object.keys(songs).filter(n=>n.toLowerCase().includes($('#sq').value.toLowerCase())).sort().map(n=>`<div class=it data-s="${esc(n)}"><span>♪ ${esc(n)}</span><x data-ds="${esc(n)}">✕</x></div>`).join('')};ls();$('#sq').oninput=ls;
  $('#sf').onchange=async e=>{for(const f of e.target.files)await put('song',{name:f.name.replace(/\.txt$/i,''),text:await f.text()});await boot()}}
 else if(tab=='Media'){p.innerHTML=`<div class=row><select id=ma><option>Both</option><option>Preview</option><option>Live</option></select><button onclick="$('#mf').click()">Import</button><input id=mf type=file accept=".jpg,.jpeg,.png,.mp4,.webm,.wmv" multiple hidden></div><div class=mg><div class=mt data-m="" style="display:grid;place-items:center">None</div>${Object.values(media).map(m=>`<div class=mt data-m="${esc(m.name)}">${m.k=='v'?`<video src="${url(m)}" muted preload=metadata></video>`:`<img src="${url(m)}">`}<x data-dm="${esc(m.name)}">✕</x></div>`).join('')}</div><small style="color:#888">Note: browsers can't play .wmv reliably — convert to .mp4.</small>`;
  $('#mf').onchange=async e=>{for(const f of e.target.files)await put('media',{name:f.name,blob:f,k:/video|wmv/.test(f.type)||/\.(mp4|webm|wmv)$/i.test(f.name)?'v':'i'});await boot()}}
 else{p.innerHTML=`<div class=row><button onclick="$('#pf').click()">Import .pptx</button><input id=pf type=file accept=".pptx" multiple hidden></div><div id=pl></div><small style="color:#888">Recreates each slide's text boxes, images and background in their original positions. Charts, SmartArt, tables, animations and custom fonts inside the file aren't carried over.</small>`;
  $('#pl').innerHTML=Object.keys(pptxs).sort().map(n=>`<div class=it data-p="${esc(n)}"><span>🖵 ${esc(n)}</span><x data-dp="${esc(n)}">✕</x></div>`).join('')||'<span style="color:#777">No presentations imported yet.</span>';
  $('#pf').onchange=async e=>{if(typeof JSZip=='undefined'){alert('PPTX support needs an internet connection the first time (to load the unzip library). Try again while online.');e.target.value='';return}for(const f of e.target.files){try{const sl2=await parsePptx(f);if(sl2.length)await put('pptx',{name:f.name.replace(/\.pptx$/i,''),slides:sl2});else alert(f.name+': no slides found in this presentation.')}catch(err){console.error(err);alert('Could not read '+f.name+' — is it a valid .pptx file?')}}await boot()}}}
async function boot(){bibles={};(await all('bible')).forEach(b=>bibles[b.name]=b.data);
 if(!Object.keys(bibles).length){try{const r=await fetch('niv.json');if(r.ok){const d=await r.json();const{data,name}=normalizeBible(d);await put('bible',{name:(name||'NIV').toUpperCase(),data});bibles[(name||'NIV').toUpperCase()]=data}}catch(e){}}
 songs={};(await all('song')).forEach(s=>songs[s.name]=s);media={};(await all('media')).forEach(m=>media[m.name]=m);pptxs={};(await all('pptx')).forEach(p=>pptxs[p.name]=p);
 customFonts={};(await all('font')).forEach(f=>customFonts[f.name]=f.data);injectFonts();renderFontSelect();
 if(!bibles[ver])ver=Object.keys(bibles)[0]||'';panel();draw()}
// ---------- GitHub folder auto-discovery ----------
async function githubSync(){const btn=$('#gsync');try{if(btn){btn.disabled=true;btn.textContent='⏳'}
 const host=location.hostname;if(!host.endsWith('.github.io'))return;
 const owner=host.split('.')[0],segs=location.pathname.split('/').filter(Boolean);
 const cands=[];if(segs.length)cands.push({repo:segs[0],dir:segs.slice(1,-1).join('/')});
 cands.push({repo:owner+'.github.io',dir:segs.slice(0,-1).join('/')});
 let files=null;for(const c of cands){try{const r=await fetch(`https://api.github.com/repos/${owner}/${c.repo}/contents/${c.dir}`);if(r.ok){const j=await r.json();if(Array.isArray(j)){files=j;break}}}catch(e){}}
 if(!files)return;
 const haveB=new Set(Object.keys(bibles)),haveS=new Set(Object.keys(songs)),haveM=new Set(Object.keys(media)),haveP=new Set(Object.keys(pptxs));
 for(const f of files){if(f.type!=='file')continue;const name=f.name,low=name.toLowerCase();
  if(low==='index.html'||!f.download_url)continue;
  if(low.endsWith('.json')){const base=name.replace(/\.json$/i,'').toUpperCase();if(haveB.has(base))continue;
   try{const raw=await(await fetch(f.download_url)).json();const{data,name:mn}=normalizeBible(raw);const nm=(mn||base).toUpperCase();if(!haveB.has(nm))await put('bible',{name:nm,data})}catch(e){}}
  else if(/\.(jpe?g|png|mp4|webm|wmv)$/i.test(name)){if(haveM.has(name))continue;
   try{const blob=await(await fetch(f.download_url)).blob();await put('media',{name,blob,k:/\.(mp4|webm|wmv)$/i.test(name)?'v':'i'})}catch(e){}}
  else if(low.endsWith('.pptx')){const base=name.replace(/\.pptx$/i,'');if(haveP.has(base)||typeof JSZip=='undefined')continue;
   try{const blob=await(await fetch(f.download_url)).blob();const file=new File([blob],name);const sl2=await parsePptx(file);if(sl2.length)await put('pptx',{name:base,slides:sl2})}catch(e){}}
  else if(low.endsWith('.txt')){const base=name.replace(/\.txt$/i,'');if(haveS.has(base))continue;
   try{const text=await(await fetch(f.download_url)).text();await put('song',{name:base,text})}catch(e){}}}
 await boot()}catch(e){console.error('GitHub sync failed',e)}finally{if(btn){btn.disabled=false;btn.textContent='🔄'}}}
// events
document.addEventListener('click',e=>{const t=e.target,g=a=>t.closest(`[${a}]`)?.getAttribute(a);
 if(g('data-t')){tab=g('data-t');panel()}else if(t.dataset.ds){del('song',t.dataset.ds).then(boot)}else if(g('data-s')!==null&&g('data-s')!==undefined)song(g('data-s'));
 else if(t.dataset.dm){del('media',t.dataset.dm).then(boot)}else if(g('data-m')!==null&&g('data-m')!==undefined){const m=media[g('data-m')],b=m?{u:url(m),k:m.k}:null,w=$('#ma').value;if(w!='Live'){pv.bg=b;P.setBg(b)}if(w!='Preview'){lv.bg=b;L.setBg(b);send({bg:b})}}
 else if(t.dataset.dp){del('pptx',t.dataset.dp).then(boot)}else if(g('data-p')!==null&&g('data-p')!==undefined)pptxLoad(g('data-p'));
 else if(t.dataset.dtp){delete templates[t.dataset.dtp];localStorage.setItem('dow.tpl',JSON.stringify(templates));renderTemplates()}else if(g('data-tp')!==null&&g('data-tp')!==undefined)applyTemplate(g('data-tp'));
 else if(g('data-i')!==null&&g('data-i')!==undefined)pick(+g('data-i'));else if(t.dataset.x){dock.splice(+t.dataset.x,1);sv()}else if(g('data-d')!==null&&g('data-d')!==undefined){const d=dock[+g('data-d')];d.t=='b'?bible(d.ref,d.v):d.t=='s'?song(d.name):pptxLoad(d.name)}});
const sv=()=>{localStorage.setItem('dow.d',JSON.stringify(dock));draw()};
$('#ad').onclick=()=>{if(cur){dock.push(cur);sv()}};$('#tk').onclick=take;$('#bl').onclick=blank;$('#pr').onclick=()=>pick(idx-1);$('#nx').onclick=()=>pick(idx+1);
$('#tr').value=S.tr;$('#tr').onchange=e=>{S.tr=e.target.value;applyS()};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key=='ArrowRight')pick(idx+1);if(e.key=='ArrowLeft')pick(idx-1);if(e.key=='Enter')take();if(e.key=='b'||e.key=='B')blank()});
$('#op').onclick=async()=>{let f='popup=yes,width=1280,height=720';try{const d=await getScreenDetails(),s=d.screens.find(x=>!x.isPrimary)||d.screens[0];f=`popup=yes,left=${s.availLeft},top=${s.availTop},width=${s.availWidth},height=${s.availHeight}`}catch(e){}
 win=open(location.pathname+'#out','dow-out',f);if(win)setTimeout(()=>send({s:S,sl:lv.sl,bg:lv.bg,tr:'cut',fontsCSS:fontsCSS()}),800)};
// settings form
const F=[['Top %','m0',0,40],['Right %','m1',0,40],['Bottom %','m2',0,40],['Left %','m3',0,40],['Font px','fs',24,160],['Dim bg %','dim',0,90]];
$('#st').innerHTML=F.map(([l,k,a,b])=>`<label>${l}<input type=number data-k=${k} min=${a} max=${b}></label>`).join('')+`<label>Align<select data-k=al><option value=left>Left</option><option value=right>Right</option><option value=center>Centred</option><option value=justify>Justified</option></select></label><label>Font<select id=ffsel data-k=ff></select></label><label>Text colour<input type=color data-k=col></label><label>Ref colour<input type=color data-k=rcol></label><label><input type=checkbox data-k=sh> Shadow</label><label><input type=checkbox data-k=ref> Show ref</label>`;
renderFontSelect();renderTemplates();
function syncInputs(){document.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k,mm=k[0]=='m'&&k.length==2,g=()=>mm?S.m[k[1]]:S[k];i.type=='checkbox'?i.checked=g():i.value=g()})}
syncInputs();
document.querySelectorAll('[data-k]').forEach(i=>{const k=i.dataset.k,mm=k[0]=='m'&&k.length==2;
 i.oninput=()=>{const v=i.type=='checkbox'?i.checked:i.type=='number'?+i.value:i.value;mm?S.m[k[1]]=v:S[k]=v;applyS()}});
$('#fib').onclick=()=>$('#fif').click();
$('#fif').onchange=async e=>{for(const f of e.target.files){const buf=await f.arrayBuffer();const durl=`data:font/ttf;base64,${b64(buf)}`;const name=f.name.replace(/\.[^.]+$/,'');customFonts[name]=durl;await put('font',{name,data:durl})}injectFonts();renderFontSelect();applyS()};
$('#tpsv').onclick=()=>{const n=$('#tpn').value.trim();if(!n)return;templates[n]={...S};localStorage.setItem('dow.tpl',JSON.stringify(templates));$('#tpn').value='';renderTemplates()};
const setTheme=t=>{document.body.classList.toggle('light',t=='light');localStorage.setItem('dow.theme',t)};
setTheme(localStorage.getItem('dow.theme')||'dark');
$('#th').onclick=()=>setTheme(document.body.classList.contains('light')?'dark':'light');
$('#gsync').onclick=()=>githubSync();
P.cfg(S);L.cfg(S);boot().then(()=>githubSync())}
</script></body></html>
